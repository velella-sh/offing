name: Action v1 conformance
description: Check the bundled Offing Action in the workspace against the v1 contract.
runs:
  using: composite
  steps:
    - name: Prepare isolated consumer checkouts
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/clean" "$RUNNER_TEMP/gate/.github/workflows"
        printf '%s\n' '{"private":true}' > "$RUNNER_TEMP/clean/package.json"
        printf '%s\n' 'jobs:' '  test:' '    steps:' '      - uses: actions/checkout@v4' > "$RUNNER_TEMP/gate/.github/workflows/ci.yml"
    - name: Scan a clean fixture with defaults
      id: clean
      uses: ./ # zizmor: ignore[self-repository] -- the checked-out Action is the subject of the test
      with:
        path: ${{ runner.temp }}/clean
    - name: Check the clean scan
      env:
        OUTPUTS: ${{ toJSON(steps.clean.outputs) }}
        OUTCOME: ${{ steps.clean.outcome }}
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../docs/spec/action/conformance/run.mjs" clean "$OUTCOME" <<< "$OUTPUTS"
    - name: Exercise the severity gate and local SARIF
      if: ${{ !cancelled() }}
      id: gate
      continue-on-error: true
      uses: ./ # zizmor: ignore[self-repository] -- the checked-out Action is the subject of the test
      with:
        path: ${{ runner.temp }}/gate
        sarif: "true"
        upload-report: "false"
    - name: Check the gate and SARIF outputs
      if: ${{ !cancelled() }}
      env:
        OUTPUTS: ${{ toJSON(steps.gate.outputs) }}
        OUTCOME: ${{ steps.gate.outcome }}
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../docs/spec/action/conformance/run.mjs" gate "$OUTCOME" <<< "$OUTPUTS"
    - name: Check the lifecycle SARIF profile
      if: ${{ !cancelled() }}
      env:
        SARIF_PATH: ${{ steps.gate.outputs.sarif-path }}
      shell: bash
      run: |
        if [ -z "$SARIF_PATH" ]; then
          echo "::error::Offing did not produce a local SARIF file at sarif-path."
          exit 1
        fi
        node "$GITHUB_ACTION_PATH/../../../docs/spec/sarif/conformance/check.mjs" "$SARIF_PATH"
