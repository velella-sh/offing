# Release stage: generate the CycloneDX SBOM from the production dependency tree, validate it against
# the CycloneDX 1.5 schema and lifecycle profile, derive the VEX file from the reviewed statements in security/vex, validate
# that too, sign both keylessly, and attach them to the GitHub release.
# A dry run generates and validates them and attaches nothing.
name: Release SBOM

on:
  workflow_call:
    inputs:
      dry_run:
        description: Generate and validate only; do not attach to a GitHub release
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    # Called from release.yml on a version tag, so the OIDC identity is this file @ refs/tags/vX.Y.Z.
    env:
      IDENTITY_PATTERN: ^https://github\.com/velella-sh/offing/\.github/workflows/release-sbom\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - name: Generate the SBOM from what the package installs
        run: |
          npm ls --omit=dev --all --json > npm-tree.json
          node .github/scripts/release-sbom.mjs generate --tree npm-tree.json --output sbom.cdx.json
      - name: Enrich and check the SBOM lifecycle profile
        run: |
          npm run build --silent
          node dist/src/cli.js sbom enrich sbom.cdx.json --data-version bundled > sbom.enriched.json
          node docs/spec/lifecycle-properties/conformance/check.mjs sbom.enriched.json
          mv sbom.enriched.json sbom.cdx.json
      - name: Validate the SBOM against the CycloneDX schema and the release tree
        run: node .github/scripts/release-sbom.mjs check sbom.cdx.json --tree npm-tree.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lifecycle-release-sbom
          path: sbom.cdx.json
          if-no-files-found: error
      - name: Generate and validate the VEX file from security/vex
        run: |
          node .github/scripts/release-vex.mjs generate --sbom sbom.cdx.json --statements security/vex --output vex.cdx.json
          node .github/scripts/release-vex.mjs check vex.cdx.json --sbom sbom.cdx.json --statements security/vex
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: ${{ !inputs.dry_run }}
      - name: Sign and verify the SBOM (keyless)
        if: ${{ !inputs.dry_run }}
        run: |
          cosign sign-blob --yes --bundle sbom.cdx.json.sigstore.json sbom.cdx.json
          cosign verify-blob \
            --bundle sbom.cdx.json.sigstore.json \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-identity-regexp "${IDENTITY_PATTERN}" \
            sbom.cdx.json
      - name: Sign and verify the VEX file (keyless)
        if: ${{ !inputs.dry_run }}
        run: |
          cosign sign-blob --yes --bundle vex.cdx.json.sigstore.json vex.cdx.json
          cosign verify-blob \
            --bundle vex.cdx.json.sigstore.json \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-identity-regexp "${IDENTITY_PATTERN}" \
            vex.cdx.json
      - name: Attach to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            prerelease=""
            case "$tag" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$tag" --verify-tag --title "$tag" --notes "SBOM for $tag. Release notes follow." $prerelease
          fi
          gh release upload "$tag" sbom.cdx.json sbom.cdx.json.sigstore.json --clobber
          gh release upload "$tag" vex.cdx.json vex.cdx.json.sigstore.json --clobber
      - name: Record dry-run stage
        if: inputs.dry_run
        run: echo "Publish stage (SBOM) generated and validated sbom.cdx.json and vex.cdx.json; nothing was attached." >> "$GITHUB_STEP_SUMMARY"

  attest:
    needs: sbom
    uses: ./.github/workflows/release-attest.yml # zizmor: ignore[self-repository] -- it calls a stage of this same release pipeline
    permissions:
      contents: write
      attestations: write
      id-token: write
    with:
      dry_run: ${{ inputs.dry_run }}

  verify-attestation:
    needs: attest
    uses: ./.github/workflows/release-verify.yml # zizmor: ignore[self-repository] -- it calls a stage of this same release pipeline
    with:
      dry_run: ${{ inputs.dry_run }}
      run_notes: false
      run_reproducible: false
      run_lifecycle: true
