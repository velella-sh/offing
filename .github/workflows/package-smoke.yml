            printf -- '- Installed CLI %s at %s\n' "$(node "$OFFING_GUARDRAILS_CLI" --version)" "$GITHUB_SHA"
            printf -- '- Dry run left Git unchanged. Pinned replay and test-only fixtures passed with refusals, redaction, budgets, and undo.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-proof-bundle
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          package="$out/npm-install/node_modules/@velella/offing"
          test -f "$package/docs/spec/proof/v1.md"
          test -f "$package/schemas/proof.v1.schema.json"
          node "$package/docs/spec/proof/conformance/suite.mjs" "$bin"
          example="$out/proof-example"
          unzip -q "$package/docs/spec/proof/example/evaluation.zip" -d "$example"
          git clone --quiet --branch proof-evaluation "$example/evaluation.bundle" "$out/proof-evaluation"
          "$bin" proof verify "$example/offing-proof.json" --repo "$out/proof-evaluation"
          node "$package/docs/spec/proof/conformance/check.mjs" "$example/offing-proof.json" "$out/proof-evaluation"
          mkdir "$out/proof-acceptance"
          cp "$example"/offing-proof.json "$example"/offing-log-*.txt "$out/proof-acceptance/"
          {
            printf '### acc-proof-bundle\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$out"/*.tgz | cut -d ' ' -f 1)"
            printf -- '- Installed CLI %s at %s\n' "$("$bin" --version)" "$GITHUB_SHA"
            printf -- '- Installed and independent verifiers agreed on five synthetic fixtures, redacted producer output and the recorded evaluation proof.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proof-acceptance
          path: ${{ runner.temp }}/package-smoke/proof-acceptance/
          if-no-files-found: error

      - name: Build the Docker image and scan the fixture
        id: docker
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          docker build -t offing-package-smoke .
          # Same network-free, read-only shape as the release image smoke.
          docker run --rm --network none --read-only \
            -v "$RUNNER_TEMP/offing-smoke:/workspace:ro" \
            offing-package-smoke scan /workspace --json > "$out/docker-scan.json"
          echo "path=$out/docker-scan.json" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          node -e '
            const scan = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (scan.schemaVersion !== "offing.scan.v1") throw new Error("docker scan is not a scan result");
            if (!scan.findings?.length) throw new Error("docker scan found nothing on the smoke fixture");
            console.log(`docker scan: ${scan.findings.length} findings`);
          ' "$out/docker-scan.json"

      - name: acc-fix-pr
        env:
          OFFING_FIX_PR_ACTION: ${{ github.workspace }}/dist/action/index.js
          OFFING_FIX_PR_EVIDENCE: ${{ runner.temp }}/acc-fix-pr-evidence
        run: |
          node --test dist/tests/action-fix-pr.test.js dist/tests/fix-pr-body.test.js
          printf '### acc-fix-pr\n\nCandidate Action passed isolated Git and GitHub API fixtures. Tested commit %s.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate fix PR evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acc-fix-pr-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acc-fix-pr-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Scan the fixture with the local Action # zizmor: ignore[self-repository] -- it scans the fixture with the action under test
        id: action
        uses: ./
        with:
          path: ${{ runner.temp }}/offing-smoke
          fail-on-severity: none
          upload-report: "false"
          upload-sarif: "false"
          upload-badge: "false"

      - name: Assert Action outputs and compare all three scans
        env:
          NPM_SCAN: ${{ steps.npm.outputs.path }}
          DOCKER_SCAN: ${{ steps.docker.outputs.path }}
          ACTION_REPORT: ${{ steps.action.outputs.report-path }}
          ACTION_COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          set -euo pipefail
          test -n "$ACTION_REPORT"
          test -f "$ACTION_REPORT"
          test -n "$ACTION_COUNT"
          node .github/scripts/release-smoke.mjs "$NPM_SCAN" "$DOCKER_SCAN"
          node .github/scripts/release-smoke.mjs "$NPM_SCAN" "$ACTION_REPORT"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const npm = JSON.parse(fs.readFileSync(process.env.NPM_SCAN, "utf8"));
            const expected = String(npm.findings.length);
            if (process.env.ACTION_COUNT !== expected) {
              throw new Error(`Action finding-count is ${process.env.ACTION_COUNT}, expected ${expected}`);
            }
            console.log(`All three channels agree on ${expected} findings.`);
          '

      - name: acc-lifecycle-attestation
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarballs=("$out"/*.tgz)
          test "${#tarballs[@]}" = 1
          tarball="${tarballs[0]}"
          suite="$package/docs/spec/lifecycle-attestation"
          test -f "$package/schemas/lifecycle-attestation.v1.schema.json"
          test -f "$package/templates/workflows/offing-attest.yml"
          "$bin" attest --subject "$tarball" --sbom "$GITHUB_WORKSPACE/tests/fixtures/attestation/bom.cdx.json" \
            --data-version bundled > lifecycle.intoto.json
          "$bin" attest check lifecycle.intoto.json --subject "$tarball"
          node "$suite/conformance/check.mjs" --suite node "$suite/example/verify.mjs"
          node "$suite/example/verify.mjs" lifecycle.intoto.json "$tarball"
          {
            printf '### acc-lifecycle-attestation\n\n'
            printf -- '- Candidate artifact SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI %s at %s\n' "$("$bin" --version)" "$GITHUB_SHA"
            printf -- '- Unsigned statement, packaged schema and template, and standalone conformance verified.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the exact packed candidate and five synthetic binary subjects
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p lifecycle-acceptance/npm-install
          cp package-smoke/*.tgz lifecycle-acceptance/
          cp package-smoke/npm-install/{package.json,package-lock.json} lifecycle-acceptance/npm-install/
          cd lifecycle-acceptance
          version="$("$RUNNER_TEMP/package-smoke/npm-install/node_modules/.bin/offing" --version)"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64.exe; do
            printf 'Offing lifecycle attestation synthetic %s binary\n' "$target" > "offing-$version-$target"
          done
          sha256sum offing-* velella-offing-*.tgz > lifecycle-subjects.sha256
          "$RUNNER_TEMP/package-smoke/npm-install/node_modules/.bin/offing" attest \
            --subject velella-offing-*.tgz --sbom "$GITHUB_WORKSPACE/tests/fixtures/attestation/bom.cdx.json" \
            --data-version bundled > draft.json
          jq -e '.predicate' draft.json > predicate.json
          jq -R -s --slurpfile draft draft.json '
            [split("\n")[] | select(length > 0) | split("  ") | {name: .[1], digest: {sha256: .[0]}}] as $subjects
            | $draft[0] | .subject = $subjects
          ' lifecycle-subjects.sha256 > prepared.intoto.json
          rm draft.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: lifecycle-acceptance
          path: ${{ runner.temp }}/lifecycle-acceptance/
          if-no-files-found: error

      - name: acc-release-gate (installed CLI and standalone fixtures)
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          bin="$out/npm-install/node_modules/.bin/offing"
          fixture="$GITHUB_WORKSPACE/tests/fixtures/release-gate/blocked.cdx.json"
          tarball=("$out"/*.tgz)
          test "${#tarball[@]}" = 1
          test -f "$package/schemas/release-gate.v1.schema.json"
          test -f "$package/templates/workflows/offing-release-gate.yml"
          mkdir consumer-release
          git -C consumer-release init -q
          printf '[tools]\nnode = "24"\n' > consumer-release/mise.toml
          cp "$fixture" consumer-release/inventory.cdx.json
          {
            printf '### acc-release-gate\n\n'
            printf -- '- Candidate artifact SHA-256 %s\n' "$(sha256sum "${tarball[0]}" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI %s at %s\n' "$("$bin" --version)" "$GITHUB_SHA"
            node "$package/docs/spec/release-gate/conformance/check.mjs"
            node "$package/docs/spec/release-gate/conformance/check-cli.mjs" "$package/dist/src/cli.js"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-release-gate (compliant checkout) # zizmor: ignore[self-repository] -- uses the locally built candidate
        uses: ./
        with:
          path: ${{ runner.temp }}/consumer-release
          release-gate-days: '30'
          fail-on-severity: none

      - name: acc-release-gate (blocked SBOM) # zizmor: ignore[self-repository] -- uses the locally built candidate
        id: release_gate_blocked
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/consumer-release
          sbom: inventory.cdx.json
          release-gate-days: '30'
          fail-on-severity: none

      - name: Check the blocked Action outcome
        env:
          BLOCKED_OUTCOME: ${{ steps.release_gate_blocked.outcome }}
        run: test "$BLOCKED_OUTCOME" = failure
