name: Package smoke

# Proves the packages people install match what CI builds: the npm tarball, the Docker image, and the
# local Action all scan the same fixture and return the same findings. A broken `files` list in
# package.json fails here because the packed CLI would miss registry data or the bin entry.

on:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      action_conformance_only:
        description: Build the selected source revision and run the reusable Action conformance workflow.
        type: boolean
        default: false
      autopilot_action_only:
        description: Run only the synthetic Autopilot Action dispatch acceptance.
        type: boolean
        default: false
      launch_readiness_only:
        description: Generate the launch readiness report and test the workflow without updating an issue.
        type: boolean
        default: false
      agent_leaderboard_only:
        description: Run the isolated agent replay fixture and refusal checks.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  agent-leaderboard:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.agent_leaderboard_only }}
    name: acc-agent-leaderboard (isolated replay)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Check network denial and task inputs with generated fixture code
        env:
          OFFING_AGENT_LEADERBOARD_DOCKER: "1"
        run: node --test dist/tests/agent-harness-sandbox.test.js dist/tests/agent-harness.test.js

  launch-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.launch_readiness_only }}
    uses: ./.github/workflows/launch-readiness-report.yml # zizmor: ignore[self-repository] -- exercise only the read-only report
    permissions:
      actions: read
      contents: read
    with:
      verify_only: true

  action-conformance:
    if: ${{ inputs.action_conformance_only && !inputs.autopilot_action_only && !inputs.launch_readiness_only }}
    uses: ./.github/workflows/action-conformance.yml # zizmor: ignore[self-repository] -- tests the reusable workflow from this revision
    with:
      build: true

  autopilot-action:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.autopilot_action_only && !inputs.launch_readiness_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - name: Build the Action bundle and its acceptance fixture
        run: npm run build --silent && npm run build:action --silent
      - name: acc-autopilot-action (dispatch and replay fixtures)
        env:
          OFFING_AUTOPILOT_ACTION_BUNDLE: ${{ github.workspace }}/dist/action/index.js
          OFFING_AUTOPILOT_FIXTURE_EVIDENCE: ${{ runner.temp }}/offing-autopilot-fixture
          OFFING_DATA_VERSION: bundled
        run: |
          set -euo pipefail
          driver_dir="$RUNNER_TEMP/offing-action-driver"
          mkdir "$driver_dir"
          cp tests/fixtures/action-autopilot/driver/package.json.fixture "$driver_dir/package.json"
          cp tests/fixtures/action-autopilot/driver/package-lock.json.fixture "$driver_dir/package-lock.json"
          npm ci --prefix "$driver_dir" --no-audit --no-fund
          "$RUNNER_TEMP/offing-action-driver/node_modules/.bin/claude" --version | grep -F '2.1.330'
          node --test dist/tests/action-autopilot.test.js dist/tests/action-autopilot-replay.test.js
          {
            printf '### acc-autopilot-action\n\n'
            printf -- '- Action bundle SHA-256 %s\n' "$(sha256sum "$OFFING_AUTOPILOT_ACTION_BUNDLE" | cut -d ' ' -f 1)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            printf -- '- Pinned driver setup, a synthetic-key turn, Docker tests, and missing-key refusal passed.\n'
            printf -- '- Clean Action replay passed through the Docker runner, local Git remote and in-process GitHub API fixture with no provider key.\n'
            printf -- '- Verified event refusals, turn-cap usage, green and draft retests, protected human commits, stale PR closure, and proof/log digests.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the verified replay fixture evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: offing-autopilot-fixture-evidence
          path: ${{ runner.temp }}/offing-autopilot-fixture
          if-no-files-found: error
          retention-days: 14

  attest-proof:
    needs: smoke
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/proof-attestation.yml # zizmor: ignore[self-repository] -- tests the reusable signer from this revision
    with:
      proof-artifact: proof-acceptance

  attest-lifecycle:
    if: github.event_name == 'workflow_dispatch' && !inputs.agent_leaderboard_only
    needs: smoke
    name: acc-lifecycle-attestation (signed fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      PREDICATE_TYPE: https://velella.sh/offing/attestation/v1/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lifecycle-acceptance
          path: fixture
      - name: Sign the fixture's lifecycle predicate
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: fixture/lifecycle-subjects.sha256
          predicate-type: ${{ env.PREDICATE_TYPE }}
          predicate-path: fixture/predicate.json
      - name: Stage the signature bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE" lifecycle.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lifecycle-acceptance-signed
          path: lifecycle.sigstore.json
          if-no-files-found: error

  gate-signed-lifecycle:
    if: github.event_name == 'workflow_dispatch' && !inputs.agent_leaderboard_only
    needs: attest-lifecycle
    name: acc-release-gate (signed lifecycle fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PREDICATE_TYPE: https://velella.sh/offing/attestation/v1/
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lifecycle-acceptance
          path: fixture
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lifecycle-acceptance-signed
          path: fixture
      - name: Install the exact packed candidate
        working-directory: fixture/npm-install
        run: npm ci --omit=dev --ignore-scripts --no-fund --no-audit
      - name: Fetch trust roots for offline verification
        working-directory: fixture
        run: gh attestation trusted-root > trusted_root.jsonl
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: acc-lifecycle-attestation (clean consumer)
        working-directory: fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer="$GITHUB_REPOSITORY/.github/workflows/package-smoke.yml"
          verify_gh() {
            gh attestation verify "$1" --bundle lifecycle.sigstore.json --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$2" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --predicate-type "$PREDICATE_TYPE" --deny-self-hosted-runners
          }
          verify_cosign() {
            cosign verify-blob-attestation "$1" --bundle lifecycle.sigstore.json --check-claims=true \
              --type "$PREDICATE_TYPE" --certificate-identity "https://github.com/$2@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          }
          expect_rejection() {
            if "$@"; then
              echo "Expected rejection: $*" >&2
              exit 1
            fi
          }
          sha256sum offing-* velella-offing-*.tgz | cmp - lifecycle-subjects.sha256
          jq -er '.dsseEnvelope.payload' lifecycle.sigstore.json | base64 -d > lifecycle.intoto.json
          jq -e --slurpfile expected prepared.intoto.json '
            def ordered: .subject |= sort_by(.name);
            ordered == ($expected[0] | ordered)
          ' lifecycle.intoto.json > /dev/null
          tarballs=(velella-offing-*.tgz)
          tar -xzf "${tarballs[0]}" \
            package/docs/spec/lifecycle-attestation/conformance/check.mjs \
            package/docs/spec/lifecycle-attestation/example/verify.mjs
          verifier=package/docs/spec/lifecycle-attestation/example/verify.mjs
          node package/docs/spec/lifecycle-attestation/conformance/check.mjs lifecycle.intoto.json
          for subject in offing-* velella-offing-*.tgz; do
            verify_gh "$subject" "$signer"
            verify_cosign "$subject" "$signer"
            node "$verifier" lifecycle.intoto.json "$subject" > /dev/null
          done
          wrong_signer="$GITHUB_REPOSITORY/.github/workflows/release-attest.yml"
          expect_rejection verify_gh "${tarballs[0]}" "$wrong_signer"
          expect_rejection verify_cosign "${tarballs[0]}" "$wrong_signer"
          mkdir tampered
          tampered="tampered/${tarballs[0]}"
          cp -- "${tarballs[0]}" "$tampered"
          printf 'tampered' >> "$tampered"
          expect_rejection verify_gh "$tampered" "$signer"
          expect_rejection verify_cosign "$tampered" "$signer"
          expect_rejection node "$verifier" lifecycle.intoto.json "$tampered"
          for example in 2026-03-31:1 2026-04-01:0 2026-04-02:-1; do
            npm-install/node_modules/.bin/offing attest check lifecycle.sigstore.json \
              --subject "${tarballs[0]}" --today "${example%:*}" |
              grep -F -- '"pkg:docker/library/alpine@3.18"' |
              grep -F -- ": ${example#*:} days left"
          done
          {
            printf '### acc-lifecycle-attestation (clean consumer)\n\n'
            printf 'Signed subjects at %s\n\n' "$GITHUB_SHA"
            printf '```text\n'
            cat lifecycle-subjects.sha256
            printf '```\n\nBoth signature verifiers rejected the wrong signer and modified bytes. The installed CLI reproduced the documented day counts.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluate the signed predicate on either side of the deadline
        working-directory: fixture
        run: |
          set -euo pipefail
          bin=npm-install/node_modules/.bin/offing
          package=npm-install/node_modules/@velella/offing
          tarballs=(velella-offing-*.tgz)
          tarball="${tarballs[0]}"
          signer="$GITHUB_REPOSITORY/.github/workflows/package-smoke.yml"
          export GH_CONFIG_DIR="$RUNNER_TEMP/offing-gate-gh"
          export OFFING_DATA_VERSION=bundled
          {
            printf '### acc-release-gate (signed lifecycle fixture)\n\n'
            printf -- '- Candidate tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI %s at %s\n' "$("$bin" --version)" "$GITHUB_SHA"
            node "$package/docs/spec/release-gate/conformance/check-cli.mjs" "$package/dist/src/cli.js" \
              lifecycle.sigstore.json "$tarball" "tampered/$tarball" trusted_root.jsonl "$GITHUB_REPOSITORY" "$signer"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    if: ${{ !inputs.action_conformance_only && !inputs.autopilot_action_only && !inputs.launch_readiness_only && !inputs.agent_leaderboard_only }}
    name: npm, Docker, and Action
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - name: Build the package and the Action bundle under test
        run: |
          npm run build
          # Ordinary pull requests ship the committed Action bundle; rebuild so this job compares the
          # source under test, not a stale release artifact.
          npm run build:action --silent
          mkdir -p "$RUNNER_TEMP/offing-smoke"
          cp tests/fixtures/smoke/package.json.fixture "$RUNNER_TEMP/offing-smoke/package.json"

      - name: Pack, install, and scan with the npm tarball
        id: npm
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/offing-smoke"
          out="$RUNNER_TEMP/package-smoke"
          mkdir -p "$out"
          # prepack runs the full check; build already ran, so pack the built tree only.
          npm pack --ignore-scripts --pack-destination "$out"
          # Scoped package name @velella/offing packs as velella-offing-*.tgz, not offing-*.tgz.
          tarball="$(ls "$out"/*.tgz)"
          install_dir="$out/npm-install"
          node dist/tools/prepare-package-smoke.js "$tarball" "$install_dir"
          (
            cd "$install_dir"
            # The setup's npm ci populated these exact dependency integrities in the npm cache.
            npm ci --offline --omit=dev --ignore-scripts --no-fund --no-audit
          )
          bin="$install_dir/node_modules/.bin/offing"
          version="$("$bin" --version)"
          echo "Installed offing --version: $version"
          test -n "$version"
          "$bin" scan "$fixture" --json > "$out/npm-scan.json"
          echo "path=$out/npm-scan.json" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          node -e '
            const scan = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (scan.schemaVersion !== "offing.scan.v1") throw new Error("npm scan is not a scan result");
            if (!scan.findings?.length) throw new Error("npm scan found nothing on the smoke fixture");
            const rules = new Set(scan.findings.map((f) => f.ruleId));
            if (!rules.has("npm.package.request.deprecated")) throw new Error("npm scan missed the deprecated package");
            if (![...rules].some((id) => id.startsWith("nodejs.runtime."))) throw new Error("npm scan missed the Node.js runtime finding");
            console.log(`npm scan: ${scan.findings.length} findings`);
          ' "$out/npm-scan.json"

      - name: acc-launch-docs
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarball="$(ls "$out"/*.tgz)"
          {
            printf '### acc-launch-docs\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            node .github/scripts/acc-launch-docs.mjs "$bin"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: acc-codemod-kit
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarball="$(ls "$out"/*.tgz)"
          test -f "$package/docs/spec/codemod/v1.md"
          {
            printf '### acc-codemod-kit\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            node "$package/docs/spec/codemod/conformance/check.mjs" "$bin"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: acc-codemod-coverage
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarball="$(ls "$out"/*.tgz)"
          {
            printf '### acc-codemod-coverage\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            node dist/tools/codemod-coverage-smoke.js "$bin"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-sbom-scan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          node .github/scripts/acc-sbom-scan.mjs "$out"/*.tgz \
            "$out/npm-install/node_modules/.bin/offing" dist/action/index.js

      - name: acc-lifecycle-sbom
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          {
            printf '### acc-lifecycle-sbom\n\n'
            node "$GITHUB_WORKSPACE/.github/scripts/acc-lifecycle-sbom.mjs" "$bin"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: acc-version-files
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          fixture="$RUNNER_TEMP/version-files"
          mkdir -p "$fixture"
          cp "$GITHUB_WORKSPACE/tests/fixtures/version-files/consumer/mise.toml" "$fixture/"
          "$bin" scan "$fixture" --json > "$out/version-files-scan.json"
          node -e '
            const scan = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const atPin = ({ location }) => location.path === "mise.toml" && location.line === 2;
            if (!scan.findings.some((f) => f.ruleId === "nodejs.runtime.eol-18" && atPin(f))) {
              throw new Error("npm scan missed the Node.js 18 pin in mise.toml");
            }
            if (!scan.unclassified?.references.some((r) => r.reference === "lts" && r.reason.startsWith("no-data:") && atPin(r))) {
              throw new Error("npm scan missed the unresolved mise alias");
            }
          ' "$out/version-files-scan.json"
          {
            printf '### acc-version-files\n\n'
            printf -- '- Tarball %s\n' "$(basename "$out"/*.tgz)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            printf -- '- offing scan found Node.js 18 and reported lts as no-data at mise.toml:2.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-config-validate
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          python3 -m venv "$out/pre-commit"
          "$out/pre-commit/bin/pip" install "pre-commit==4.5.1"
          node .github/scripts/acc-config-validate.mjs "$out"/*.tgz \
            "$out/npm-install/node_modules/.bin/offing" "$out/pre-commit/bin/pre-commit"

      - name: acc-guard-protocol
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarball="$(ls "$out"/*.tgz)"
          suite="$GITHUB_WORKSPACE/docs/spec/agent-guard/conformance"
          node "$suite/check.mjs" "$bin" guard --protocol
          node "$GITHUB_WORKSPACE/.github/scripts/acc-guard-protocol.mjs" "$bin"
          {
            printf '### acc-guard-protocol\n\n'
            printf -- '- Tarball %s\n' "$(basename "$tarball")"
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            printf -- '- The installed CLI and MCP server passed the standalone Agent Guard cases.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-verify-contract
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
          OFFING_NO_CACHE: "1"
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          node "$GITHUB_WORKSPACE/.github/scripts/acc-verify-contract.mjs" "$bin"
          {
            printf '### acc-verify-contract\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$out"/*.tgz | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Branch, receipt, Markdown and independent checker passed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-local-first-fix-cli
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          cli="$out/npm-install/node_modules/@velella/offing/dist/src/cli.js"
          version="$(node "$cli" --version)"
          {
            printf '### acc-local-first-fix-cli (candidate)\n\n'
            printf -- '- Installed version %s from commit %s\n' "$version" "$GITHUB_SHA"
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$out"/*.tgz | cut -d ' ' -f 1)"
            node .github/scripts/acc-local-first-fix-cli.mjs "$cli" "$version"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: acc-local-first-fix-agent
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          cli="$out/npm-install/node_modules/@velella/offing/dist/src/cli.js"
          version="$(node "$cli" --version)"
          {
            printf '### acc-local-first-fix-agent (candidate)\n\n'
            printf -- '- Installed version %s from commit %s\n' "$version" "$GITHUB_SHA"
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$out"/*.tgz | cut -d ' ' -f 1)"
            node .github/scripts/acc-local-first-fix-agent.mjs "$cli" "$version"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: acc-upgrade-blockers
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarball="$(ls "$out"/*.tgz)"
          node "$GITHUB_WORKSPACE/.github/scripts/acc-upgrade-blockers.mjs" "$bin"
          {
            printf '### acc-upgrade-blockers\n\n'
            printf -- '- Tarball %s\n' "$(basename "$tarball")"
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            printf -- '- CLI and MCP blocker graph parity, Mermaid and both SVG themes passed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-base-image-lineage
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarball="$(ls "$out"/*.tgz)"
          node "$GITHUB_WORKSPACE/.github/scripts/acc-base-image-lineage.mjs" "$bin"
          {
            printf '### acc-base-image-lineage\n\n'
            printf -- '- Tarball %s\n' "$(basename "$tarball")"
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            printf -- '- Packaged schema, scan evidence, MCP parity, and opt-in digest lookup passed.\n'
