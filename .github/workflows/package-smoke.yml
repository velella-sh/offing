name: Package smoke

# Proves the packages people install match what CI builds: the npm tarball, the Docker image, and the
# local Action all scan the same fixture and return the same findings. A broken `files` list in
# package.json fails here because the packed CLI would miss registry data or the bin entry.

on:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  smoke:
    name: npm, Docker, and Action
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - name: Build the package and the Action bundle under test
        run: |
          npm run build
          # Ordinary pull requests ship the committed Action bundle; rebuild so this job compares the
          # source under test, not a stale release artifact.
          npm run build:action --silent
          mkdir -p "$RUNNER_TEMP/offing-smoke"
          cp tests/fixtures/smoke/package.json.fixture "$RUNNER_TEMP/offing-smoke/package.json"

      - name: Pack, install, and scan with the npm tarball
        id: npm
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/offing-smoke"
          out="$RUNNER_TEMP/package-smoke"
          mkdir -p "$out"
          # prepack runs the full check; build already ran, so pack the built tree only.
          npm pack --ignore-scripts --pack-destination "$out"
          # Scoped package name @velella/offing packs as velella-offing-*.tgz, not offing-*.tgz.
          tarball="$(ls "$out"/*.tgz)"
          install_dir="$out/npm-install"
          node dist/tools/prepare-package-smoke.js "$tarball" "$install_dir"
          (
            cd "$install_dir"
            # The setup's npm ci populated these exact dependency integrities in the npm cache.
            npm ci --offline --omit=dev --ignore-scripts --no-fund --no-audit
          )
          bin="$install_dir/node_modules/.bin/offing"
          version="$("$bin" --version)"
          echo "Installed offing --version: $version"
          test -n "$version"
          "$bin" scan "$fixture" --json > "$out/npm-scan.json"
          echo "path=$out/npm-scan.json" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          node -e '
            const scan = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (scan.schemaVersion !== "offing.scan.v1") throw new Error("npm scan is not a scan result");
            if (!scan.findings?.length) throw new Error("npm scan found nothing on the smoke fixture");
            const rules = new Set(scan.findings.map((f) => f.ruleId));
            if (!rules.has("npm.package.request.deprecated")) throw new Error("npm scan missed the deprecated package");
            if (![...rules].some((id) => id.startsWith("nodejs.runtime."))) throw new Error("npm scan missed the Node.js runtime finding");
            console.log(`npm scan: ${scan.findings.length} findings`);
          ' "$out/npm-scan.json"

      - name: acc-codemod-kit
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarball="$(ls "$out"/*.tgz)"
          test -f "$package/docs/spec/codemod/v1.md"
          {
            printf '### acc-codemod-kit\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            node "$package/docs/spec/codemod/conformance/check.mjs" "$bin"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: acc-codemod-coverage
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarball="$(ls "$out"/*.tgz)"
          {
            printf '### acc-codemod-coverage\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            node dist/tools/codemod-coverage-smoke.js "$bin"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-sbom-scan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          node .github/scripts/acc-sbom-scan.mjs "$out"/*.tgz \
            "$out/npm-install/node_modules/.bin/offing" dist/action/index.js

      - name: acc-lifecycle-sbom
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          {
            printf '### acc-lifecycle-sbom\n\n'
            node "$GITHUB_WORKSPACE/.github/scripts/acc-lifecycle-sbom.mjs" "$bin"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: acc-version-files
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          fixture="$RUNNER_TEMP/version-files"
          mkdir -p "$fixture"
          cp "$GITHUB_WORKSPACE/tests/fixtures/version-files/consumer/mise.toml" "$fixture/"
          "$bin" scan "$fixture" --json > "$out/version-files-scan.json"
          node -e '
            const scan = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const atPin = ({ location }) => location.path === "mise.toml" && location.line === 2;
            if (!scan.findings.some((f) => f.ruleId === "nodejs.runtime.eol-18" && atPin(f))) {
              throw new Error("npm scan missed the Node.js 18 pin in mise.toml");
            }
            if (!scan.unclassified?.references.some((r) => r.reference === "lts" && r.reason.startsWith("no-data:") && atPin(r))) {
              throw new Error("npm scan missed the unresolved mise alias");
            }
          ' "$out/version-files-scan.json"
          {
            printf '### acc-version-files\n\n'
            printf -- '- Tarball %s\n' "$(basename "$out"/*.tgz)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            printf -- '- offing scan found Node.js 18 and reported lts as no-data at mise.toml:2.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-config-validate
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          python3 -m venv "$out/pre-commit"
          "$out/pre-commit/bin/pip" install "pre-commit==4.5.1"
          node .github/scripts/acc-config-validate.mjs "$out"/*.tgz \
            "$out/npm-install/node_modules/.bin/offing" "$out/pre-commit/bin/pre-commit"

      - name: acc-guard-protocol
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarball="$(ls "$out"/*.tgz)"
          suite="$GITHUB_WORKSPACE/docs/spec/agent-guard/conformance"
          node "$suite/check.mjs" "$bin" guard --protocol
          node "$GITHUB_WORKSPACE/.github/scripts/acc-guard-protocol.mjs" "$bin"
          {
            printf '### acc-guard-protocol\n\n'
            printf -- '- Tarball %s\n' "$(basename "$tarball")"
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            printf -- '- The installed CLI and MCP server passed the standalone Agent Guard cases.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-verify-contract
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
          OFFING_NO_CACHE: "1"
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          node "$GITHUB_WORKSPACE/.github/scripts/acc-verify-contract.mjs" "$bin"
          {
            printf '### acc-verify-contract\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$out"/*.tgz | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Branch, receipt, Markdown and independent checker passed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-upgrade-blockers
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarball="$(ls "$out"/*.tgz)"
          node "$GITHUB_WORKSPACE/.github/scripts/acc-upgrade-blockers.mjs" "$bin"
          {
            printf '### acc-upgrade-blockers\n\n'
            printf -- '- Tarball %s\n' "$(basename "$tarball")"
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            printf -- '- CLI and MCP blocker graph parity, Mermaid and both SVG themes passed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-base-image-lineage
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarball="$(ls "$out"/*.tgz)"
          node "$GITHUB_WORKSPACE/.github/scripts/acc-base-image-lineage.mjs" "$bin"
          {
            printf '### acc-base-image-lineage\n\n'
            printf -- '- Tarball %s\n' "$(basename "$tarball")"
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Tested commit %s\n' "$GITHUB_SHA"
            printf -- '- Packaged schema, scan evidence, MCP parity, and opt-in digest lookup passed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-policy
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
          OFFING_NO_CACHE: "1"
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          bin="$out/npm-install/node_modules/.bin/offing"
          node "$GITHUB_WORKSPACE/.github/scripts/acc-policy.mjs" "$bin" "$GITHUB_WORKSPACE/dist/action/index.js"
          {
            printf '### acc-policy\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$out"/*.tgz | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- CLI and Action both failed on the named policy rule, with its expired exception in JSON.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-what-if
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          bin="$out/npm-install/node_modules/.bin/offing"
          test -f "$package/schemas/whatif.v1.schema.json"
          node "$package/docs/spec/what-if/conformance/check.mjs" "$bin"
          {
            printf '### acc-what-if\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$out"/*.tgz | cut -d ' ' -f 1)"
            printf -- '- Installed CLI %s at %s\n' "$("$bin" --version)" "$GITHUB_SHA"
            printf -- '- CLI and MCP repository parity, saved fleet and validation passed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-fleet-policy
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
          OFFING_NO_CACHE: "1"
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          bin="$out/npm-install/node_modules/.bin/offing"
          test -f "$package/schemas/fleet-policy.v1.schema.json"
          node "$GITHUB_WORKSPACE/docs/spec/fleet-policy/conformance/check.mjs" "$bin"
          node "$GITHUB_WORKSPACE/.github/scripts/acc-fleet-policy.mjs" "$bin" "$GITHUB_WORKSPACE/dist/action/index.js"
          {
            printf '### acc-fleet-policy\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$out"/*.tgz | cut -d ' ' -f 1)"
            printf -- '- Installed CLI version %s\n' "$("$bin" --version)"
            printf -- '- Conformance vectors, packaged schema and Action policy parity passed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-agent-migrate
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          export OFFING_MIGRATION_TEST_CLI="$package/dist/src/cli.js"
          export OFFING_MIGRATION_TEST_REPLAY="$package/dist/src/migrate/replay.js"
          node --test dist/tests/migrate.test.js
          tarball="$(ls "$out"/*.tgz)"
          {
            printf '### acc-agent-migrate\n\n'
            printf -- '- Tarball %s (SHA-256 %s)\n' "$(basename "$tarball")" "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI %s at %s\n' "$(node "$OFFING_MIGRATION_TEST_CLI" --version)" "$GITHUB_SHA"
            printf -- '- The installed CLI replayed a scoped migration and verified its local branch and receipt.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-agent-drivers
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          bin="$out/npm-install/node_modules/.bin/offing"
          suite="$package/docs/spec/agent-driver"
          "$bin" drivers list
          "$bin" drivers test replay
          node "$suite/conformance/check.mjs" node "$suite/example/driver.mjs"
          {
            printf '### acc-agent-drivers\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$out"/*.tgz | cut -d ' ' -f 1)"
            printf -- '- Installed CLI %s at %s\n' "$("$bin" --version)" "$GITHUB_SHA"
            printf -- '- Installed CLI and independent reference passed the edit, scope and timeout cases.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-fleet-scan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          export OFFING_FLEET_TEST_CLI="$package/dist/src/cli.js"
          node --test --test-name-pattern '^(?!fleet forecast acceptance)' dist/tests/fleet-scan.test.js
          {
            printf '### acc-fleet-scan\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$out"/*.tgz | cut -d ' ' -f 1)"
            printf -- '- Installed CLI %s at %s\n' "$(node "$OFFING_FLEET_TEST_CLI" --version)" "$GITHUB_SHA"
            printf -- '- Local host fixtures passed for SHA pinning, cache resume, redaction, and rollup.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-fleet-forecast
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          export OFFING_FLEET_TEST_CLI="$package/dist/src/cli.js"
          test -f "$package/schemas/fleet-forecast.v1.schema.json"
          node --test --test-name-pattern '^fleet forecast acceptance' dist/tests/fleet-scan.test.js
          node "$OFFING_FLEET_TEST_CLI" forecast --fleet "$package/examples/forecast/fleet.json" --card > "$out/fleet-card.svg"
          cmp "$out/fleet-card.svg" docs/assets/fleet-forecast/light.svg
          {
            printf '### acc-fleet-forecast\n\n'
            printf -- '- Tarball SHA-256 %s\n' "$(sha256sum "$out"/*.tgz | cut -d ' ' -f 1)"
            printf -- '- Installed CLI %s at %s\n' "$(node "$OFFING_FLEET_TEST_CLI" --version)" "$GITHUB_SHA"
            printf -- '- Pinned host, offline recording, ownership, schema, card, ICS and Markdown passed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the Docker image and scan the fixture
        id: docker
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          docker build -t offing-package-smoke .
          # Same network-free, read-only shape as the release image smoke.
          docker run --rm --network none --read-only \
            -v "$RUNNER_TEMP/offing-smoke:/workspace:ro" \
            offing-package-smoke scan /workspace --json > "$out/docker-scan.json"
          echo "path=$out/docker-scan.json" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          node -e '
            const scan = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (scan.schemaVersion !== "offing.scan.v1") throw new Error("docker scan is not a scan result");
            if (!scan.findings?.length) throw new Error("docker scan found nothing on the smoke fixture");
            console.log(`docker scan: ${scan.findings.length} findings`);
          ' "$out/docker-scan.json"

      - name: acc-fix-pr
        env:
          OFFING_FIX_PR_ACTION: ${{ github.workspace }}/dist/action/index.js
          OFFING_FIX_PR_EVIDENCE: ${{ runner.temp }}/acc-fix-pr-evidence
        run: |
          node --test dist/tests/action-fix-pr.test.js dist/tests/fix-pr-body.test.js
          printf '### acc-fix-pr\n\nCandidate Action passed isolated Git and GitHub API fixtures. Tested commit %s.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate fix PR evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acc-fix-pr-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acc-fix-pr-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Scan the fixture with the local Action # zizmor: ignore[self-repository] -- it scans the fixture with the action under test
        id: action
        uses: ./
        with:
          path: ${{ runner.temp }}/offing-smoke
          fail-on-severity: none
          upload-report: "false"
          upload-sarif: "false"
          upload-badge: "false"

      - name: Assert Action outputs and compare all three scans
        env:
          NPM_SCAN: ${{ steps.npm.outputs.path }}
          DOCKER_SCAN: ${{ steps.docker.outputs.path }}
          ACTION_REPORT: ${{ steps.action.outputs.report-path }}
          ACTION_COUNT: ${{ steps.action.outputs.finding-count }}
        run: |
          set -euo pipefail
          test -n "$ACTION_REPORT"
          test -f "$ACTION_REPORT"
          test -n "$ACTION_COUNT"
          node .github/scripts/release-smoke.mjs "$NPM_SCAN" "$DOCKER_SCAN"
          node .github/scripts/release-smoke.mjs "$NPM_SCAN" "$ACTION_REPORT"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const npm = JSON.parse(fs.readFileSync(process.env.NPM_SCAN, "utf8"));
            const expected = String(npm.findings.length);
            if (process.env.ACTION_COUNT !== expected) {
              throw new Error(`Action finding-count is ${process.env.ACTION_COUNT}, expected ${expected}`);
            }
            console.log(`All three channels agree on ${expected} findings.`);
          '

      - name: acc-lifecycle-attestation
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          bin="$out/npm-install/node_modules/.bin/offing"
          tarballs=("$out"/*.tgz)
          test "${#tarballs[@]}" = 1
          tarball="${tarballs[0]}"
          suite="$package/docs/spec/lifecycle-attestation"
          test -f "$package/schemas/lifecycle-attestation.v1.schema.json"
          test -f "$package/templates/workflows/offing-attest.yml"
          "$bin" attest --subject "$tarball" --sbom "$GITHUB_WORKSPACE/tests/fixtures/attestation/bom.cdx.json" \
            --data-version bundled > lifecycle.intoto.json
          "$bin" attest check lifecycle.intoto.json --subject "$tarball"
          node "$suite/conformance/check.mjs" --suite node "$suite/example/verify.mjs"
          node "$suite/example/verify.mjs" lifecycle.intoto.json "$tarball"
          {
            printf '### acc-lifecycle-attestation\n\n'
            printf -- '- Candidate artifact SHA-256 %s\n' "$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI %s at %s\n' "$("$bin" --version)" "$GITHUB_SHA"
            printf -- '- Unsigned statement, packaged schema and template, and standalone conformance verified.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-release-gate (installed CLI and standalone fixtures)
        working-directory: ${{ runner.temp }}
        env:
          OFFING_DATA_VERSION: bundled
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package-smoke"
          package="$out/npm-install/node_modules/@velella/offing"
          bin="$out/npm-install/node_modules/.bin/offing"
          fixture="$GITHUB_WORKSPACE/tests/fixtures/release-gate/blocked.cdx.json"
          tarball=("$out"/*.tgz)
          test "${#tarball[@]}" = 1
          test -f "$package/schemas/release-gate.v1.schema.json"
          test -f "$package/templates/workflows/offing-release-gate.yml"
          "$bin" release-gate --sbom "$fixture" --today 2026-03-31 --support-until 2026-03-31 --json |
            jq -e '.decisions[0].verdict == "pass"'
          status=0
          "$bin" release-gate --sbom "$fixture" --today 2026-03-31 --within-days 1 --format sarif > gate.sarif || status=$?
          test "$status" -eq 1
          jq -e '.runs[0].properties.offingReleaseGate.decisions[0].verdict == "block"' gate.sarif
          mkdir consumer-release
          git -C consumer-release init -q
          printf '[tools]\nnode = "18"\n' > consumer-release/mise.toml
          git -C consumer-release add mise.toml
          git -C consumer-release -c user.name=fixture -c user.email=fixture@example.com commit -qm older
          git -C consumer-release tag v1.0.0
          printf '[tools]\nnode = "24"\n' > consumer-release/mise.toml
          git -C consumer-release add mise.toml
          git -C consumer-release -c user.name=fixture -c user.email=fixture@example.com commit -qm current
          git -C consumer-release tag v2.0.0
          (
            cd consumer-release
            "$bin" release-gate HEAD --today 2025-04-01 --within-days 29
            status=0
            "$bin" rollback-readiness v2.0.0 --candidate v1.0.0 --today 2025-04-01 --within-days 29 --json > rollback.json || status=$?
            test "$status" -eq 1
            jq -e '.decisions[0].reasons[0].ruleId == "nodejs.runtime.eol-18"' rollback.json
          )
          cp "$fixture" consumer-release/inventory.cdx.json
          {
            printf '### acc-release-gate\n\n'
            printf -- '- Candidate artifact SHA-256 %s\n' "$(sha256sum "${tarball[0]}" | cut -d ' ' -f 1)"
            printf -- '- Installed CLI %s at %s\n' "$("$bin" --version)" "$GITHUB_SHA"
            node "$package/docs/spec/release-gate/conformance/check.mjs"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: acc-release-gate (compliant checkout) # zizmor: ignore[self-repository] -- uses the locally built candidate
        uses: ./
        with:
          path: ${{ runner.temp }}/consumer-release
          release-gate-days: '30'
          fail-on-severity: none

      - name: acc-release-gate (blocked SBOM) # zizmor: ignore[self-repository] -- uses the locally built candidate
        id: release_gate_blocked
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/consumer-release
          sbom: inventory.cdx.json
          release-gate-days: '30'
          fail-on-severity: none

      - name: Check the blocked Action outcome
        env:
          BLOCKED_OUTCOME: ${{ steps.release_gate_blocked.outcome }}
        run: test "$BLOCKED_OUTCOME" = failure
