          evidence="$RUNNER_TEMP/campaign-demo-browser"
          node dist/tools/build-dashboard-data.js --today run-date
          node dist/tools/build-campaign-demo.js
          "$tools/node_modules/.bin/mizzen" build docs --theme "$tools/node_modules/@velella/lateen" --out "$site/offing" --workers auto
          mkdir "$evidence"
          docker run --rm --platform linux/amd64 --network none --shm-size=1g --workdir /repo \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github,dst=/repo/.github,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests/fixtures/campaign-20,dst=/repo/tests/fixtures/campaign-20,readonly" \
            --mount "type=bind,src=$tools,dst=/tools,readonly" \
            --mount "type=bind,src=$site,dst=/site,readonly" \
            --mount "type=bind,src=$evidence,dst=/out" \
            mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 \
            node .github/scripts/check-campaign-demo.mjs /tools /site /out
          printf -- '- The production demo route passed the WCAG axe audit, forced-colors and keyboard checks, and Lateen desktop and mobile visual comparison.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Campaign Board browser evidence
