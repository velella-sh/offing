name: Offing organization scan

# Product workflow: list every repository in a GitHub organization, scan each with Offing
# offline from one bounded fleet job, and optionally post a Slack or Teams digest. Call it from another
# workflow (`workflow_call`) or run it here with workflow_dispatch. See docs/ORG_ROLLOUT.md.

on:
  workflow_call:
    inputs:
      offing-ref:
        description: Exact Offing commit SHA. Use the SHA of the called workflow when calling from another repository.
        required: false
        default: ""
        type: string
      organization:
        description: >-
          GitHub organization to scan. Defaults to the owner of the caller
          repository. User accounts and repositories outside an organization are
          not supported.
        required: false
        default: ""
        type: string
      fail-on-severity:
        description: Lowest severity that fails a scan job (none, info, low, medium, high, or critical).
        required: false
        default: high
        type: string
      max-jobs:
        description: Maximum number of repositories scanned in parallel (bounded concurrency).
        required: false
        default: 10
        type: number
      forecast-digests:
        description: Generate an owner Markdown artifact containing repository paths and ownership.
        default: false
        type: boolean
    secrets:
      github-token:
        description: >-
          Token with read access to the organization's repositories. Pass a
          `GITHUB_TOKEN` when the caller can read the organization with its
          default token; otherwise pass a dedicated read-only token.
        required: false
      slack-webhook-url:
        description: >-
          Incoming-webhook URL for a Slack channel. When set, a digest of the
          rollup result is posted after every scan. Leave empty to skip Slack
          notifications.
        required: false
      teams-webhook-url:
        description: >-
          Workflow-webhook URL for a Microsoft Teams channel. When set, a digest
          of the rollup result is posted after every scan. Leave empty to skip
          Teams notifications.
        required: false
  workflow_dispatch:
    inputs:
      offing-ref:
        description: Exact Offing commit SHA. Use the SHA of the called workflow when calling from another repository.
        required: false
        default: ""
        type: string
      organization:
        description: GitHub organization to scan. Defaults to the owner of this repository.
        required: false
        default: ""
        type: string
      fail-on-severity:
        description: Lowest severity that fails a scan job (none, info, low, medium, high, or critical).
        required: false
        default: high
        type: string
      max-jobs:
        description: Maximum number of repositories scanned in parallel (bounded concurrency).
        required: false
        default: 10
        type: number
      forecast-digests:
        description: Generate an owner Markdown artifact containing repository paths and ownership.
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  fleet:
    name: Scan pinned fleet and publish its digest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate the Offing source pin
        id: source
        env:
          OFFING_REF: ${{ inputs.offing-ref || (github.repository == 'velella-sh/offing' && github.sha) }}
        run: |
          if [[ ! "$OFFING_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Supply offing-ref as the exact Offing workflow commit SHA." >&2
            exit 1
          fi
          echo "sha=$OFFING_REF" >> "$GITHUB_OUTPUT"

      - name: Check out the exact Offing workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: velella-sh/offing
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Install pinned CLI dependencies
        uses: $/.github/actions/setup

      - name: Build the pinned CLI
        run: npm run build --silent

      - name: Scan the organization
        id: scan
        env:
          ORGANIZATION: ${{ inputs.organization || github.repository_owner }}
          GH_TOKEN: ${{ secrets.github-token || github.token }}
          FAIL_ON: ${{ inputs.fail-on-severity }}
          MAX_JOBS: ${{ inputs.max-jobs }}
          FORECAST_DIGESTS: ${{ inputs.forecast-digests }}
        run: |
          status=0
          mkdir -p reports
          fleet_output=reports/fleet.json
          forecast_flags=()
          if [ "$FORECAST_DIGESTS" = true ]; then
            umask 077
            fleet_output="$RUNNER_TEMP/offing-forecast-input.json"
            forecast_flags=(--forecast-input)
          fi
          node dist/src/cli.js fleet "$ORGANIZATION" --jobs "$MAX_JOBS" --fail-on "$FAIL_ON" --json --progress "${forecast_flags[@]}" > "$fleet_output" || status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          if [ "$FORECAST_DIGESTS" = true ]; then
            node dist/src/cli.js forecast --fleet "$fleet_output" --digest "$RUNNER_TEMP/offing-owner-digests"
            node dist/src/cli.js rollup "$fleet_output" --json > reports/fleet.json
          fi
          node dist/src/cli.js rollup reports/fleet.json > digest.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat digest.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fleet report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: offing-fleet
          path: reports/fleet.json
          if-no-files-found: error

      - name: Upload owner forecast digests
        if: ${{ inputs.forecast-digests }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: offing-owner-digests
          path: ${{ runner.temp }}/offing-owner-digests/*.md
          if-no-files-found: ignore

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          payload="$(jq -n --rawfile raw digest.txt '
            ($raw | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")) as $escaped |
            (if ($escaped | length) > 3000 then (($escaped[:2989] | sub("&[a-z]{0,3}$"; "")) + "\n…truncated") else $escaped end) as $final |
            {
              text: "Offing organization digest",
              blocks: [
                {type: "header", text: {type: "plain_text", text: "Offing organization digest", emoji: false}},
                {type: "section", text: {type: "mrkdwn", text: $final}}
              ]
            }
          ')"
          curl --silent --fail --max-time 20 --proto "=https" -X POST --url "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload" > /dev/null

      - name: Post to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.teams-webhook-url }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then exit 0; fi
          payload="$(jq -n --rawfile raw digest.txt '{
            type: "message",
            attachments: [{
              contentType: "application/vnd.microsoft.card.adaptive",
              contentUrl: null,
              content: {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                type: "AdaptiveCard",
                version: "1.4",
                body: [
                  {type: "TextBlock", text: "Offing organization digest", weight: "Bolder", size: "Medium"},
                  {type: "TextBlock", text: $raw, wrap: true}
                ]
              }
            }]
          }')"
          curl --silent --fail --max-time 20 --proto "=https" -X POST --url "$TEAMS_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload" > /dev/null

      - name: Enforce the severity gate
        env:
          STATUS: ${{ steps.scan.outputs.status }}
        run: exit "$STATUS"
