name: Pack release candidate

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        required: true
      release_gate_fixture:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: The tag must match package.json and point at a release branch tip that adds the Action bundle
        if: ${{ !inputs.dry_run }}
        run: bash .github/scripts/check-release-tip.sh
      - name: Gate the candidate runtime dependency inventory
        env:
          USE_BLOCKED_FIXTURE: ${{ inputs.dry_run && inputs.release_gate_fixture }}
        run: bash .github/scripts/release-gate.sh
      - name: Check warm agent hook latency
        # Measure before prepack starts the CPU-intensive suite, just as the pull-request gate does.
        run: node tools/run-tests.mjs dist/tests/agent-hooks-latency.test.js
      - name: Pack and check the exact release candidate
        env:
          OFFING_HOOK_LATENCY: "0"
          OFFING_VERIFY_ACTION_BUNDLE: ${{ !inputs.dry_run && '1' || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/offing-candidate"
          # Run the gate outside npm pack so nested test packs cannot inherit the candidate's output directory.
          npm run prepack
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/offing-candidate" > "$RUNNER_TEMP/offing-candidate-pack.json"
          node dist/tools/package-size-budget.js "$RUNNER_TEMP/offing-candidate-pack.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: first-minute-candidate
          path: ${{ runner.temp }}/offing-candidate/*.tgz
          if-no-files-found: error
          retention-days: 30
