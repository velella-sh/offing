name: docs doctor

# Runs `mizzen check` on the documentation site: a build in a temporary folder that reports every broken
# link, undeclared placeholder, and navigation entry with a file and line. Errors fail the job; the
# warnings (mostly links to repository files outside docs/) stay in the log until they are cleaned.
#
# Pull requests run it only when one of the paths below changed. The merge queue cannot filter by
# path, so ci.yml calls this workflow from its `merge_group` run when the queued change touches
# those same paths (see the `changes` job there); a skipped call still lets `ci-ok` pass.

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-doctor.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-doctor-${{ github.event.pull_request.number || github.ref }}
  # A merge-queue run is the landing proof and is never cancelled by a newer push.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  doctor:
    name: mizzen check (docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the site tools
        run: |
          mkdir "$RUNNER_TEMP/site-tools"
          cp .github/site-tools/package.json .github/site-tools/package-lock.json "$RUNNER_TEMP/site-tools/"
          npm ci --prefix "$RUNNER_TEMP/site-tools" --no-audit --no-fund
      - name: Check the documentation site
        # Mizzen builds the site in a temporary folder and reports every broken link, placeholder, and
        # navigation entry. Errors fail the job; warnings stay in the log.
        run: '"$RUNNER_TEMP/site-tools/node_modules/.bin/mizzen" check docs --theme "$RUNNER_TEMP/site-tools/node_modules/@velella/lateen"'
