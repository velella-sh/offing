name: Offing fix pull request dry run

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offing-fix-pr-dry-run
  cancel-in-progress: false

jobs:
  acc-fix-pr:
    if: github.repository == 'velella-sh/offing' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - name: Build the Action and isolated fixtures
        run: |
          npm run build
          npm run build:action
      - name: Run the candidate Action against an isolated Git remote
        env:
          OFFING_FIX_PR_ACTION: ${{ github.workspace }}/dist/action/index.js
        run: |
          node --test dist/tests/action-fix-pr.test.js dist/tests/fix-pr-body.test.js
          printf '### acc-fix-pr\n\nCandidate Action exercised against local Git and a stubbed GitHub API. Live PR publication is disabled.\n' >> "$GITHUB_STEP_SUMMARY"
