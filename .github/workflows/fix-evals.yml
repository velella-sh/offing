name: fix-evals

on:
  schedule:
    - cron: "20 5 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: Evaluate the public cohort instead of the smoke fixtures
        type: boolean
        default: false

permissions: {}

jobs:
  fixtures:
    if: github.event_name == 'workflow_dispatch' && !inputs.refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - name: Reproduce known green and red baselines inside pinned Docker
        run: npm run fix-evals -- --fixtures --fixer node-buffer
      - name: Check fixture outcomes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = (name) => JSON.parse(readFileSync(`artifacts/fix-evals/${name}/evidence.json`, 'utf8'));
          const green = read('green');
          const red = read('red');
          assert.equal(green.cases[0]?.metrics.buildKeptGreen, true);
          assert.equal(green.cases[0]?.metrics.testsKeptGreen, true);
          assert.equal(green.cases[0]?.metrics.idempotent, true);
          assert.equal(red.excluded, 'baseline-not-green');
          assert.equal(red.baseline.test.attempts[0].status, 'failed');
          JS
      - name: Exercise the review path against the archived measurements
        run: bash .github/scripts/check-fix-evals-review.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fix-evals-fixture-evidence
          path: artifacts/fix-evals
          retention-days: 7

  evaluate:
    if: github.event_name == 'schedule' || inputs.refresh
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run fix-evals -- --out artifacts/fix-evals
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fix-evals-public-evidence
          path: artifacts/fix-evals
          if-no-files-found: error
          retention-days: 14

  review:
    needs: evaluate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-evals-public-evidence
          path: artifacts/fix-evals
      - name: Archive evidence only when the measured numbers change
        run: |
          set -euo pipefail
          npm run build --silent
          date=$(date -u +%F)
          node dist/benchmarks/fix-evals/archive.js artifacts/fix-evals "$date" --changed
          snapshot="benchmarks/fix-evals/results/$date"
          if [[ -n $(git status --porcelain -- "$snapshot") ]]; then
            python3 benchmarks/fix-evals/verify-archive.py "$snapshot" --selection benchmarks/fix-evals/selection.json
          fi
      - name: Open a reviewable evidence refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-fix-evals.sh
