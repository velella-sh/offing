name: fix-evals

on:
  schedule:
    - cron: "20 5 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: Evaluate the public cohort instead of the smoke fixtures
        type: boolean
        default: false

permissions: {}

jobs:
  fixtures:
    if: github.event_name == 'workflow_dispatch' && !inputs.refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - name: Reproduce known green and red baselines inside pinned Docker
        run: npm run fix-evals -- --fixtures --fixer node-buffer
      - name: Check fixture outcomes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = (name) => JSON.parse(readFileSync(`artifacts/fix-evals/${name}/evidence.json`, 'utf8'));
          const green = read('green');
          const red = read('red');
          assert.equal(green.cases[0]?.metrics.buildKeptGreen, true);
          assert.equal(green.cases[0]?.metrics.testsKeptGreen, true);
          assert.equal(green.cases[0]?.metrics.idempotent, true);
          assert.equal(red.excluded, 'baseline-not-green');
          assert.equal(red.baseline.test.attempts[0].status, 'failed');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fix-evals-fixture-evidence
          path: artifacts/fix-evals
          retention-days: 7

  evaluate:
    if: github.event_name == 'schedule' || inputs.refresh
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run fix-evals -- --out artifacts/fix-evals
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fix-evals-public-evidence
          path: artifacts/fix-evals
          if-no-files-found: error
          retention-days: 14

  review:
    needs: evaluate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-evals-public-evidence
          path: artifacts/fix-evals
      - name: Archive evidence only when the measured numbers change
        run: |
          set -euo pipefail
          npm run build --silent
          node dist/benchmarks/fix-evals/archive.js artifacts/fix-evals "$(date -u +%F)" --changed
      - name: Open a reviewable evidence refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/fix-evals-${GITHUB_RUN_ID}"
          if [ -z "$(git status --porcelain -- benchmarks/fix-evals/results/)" ]; then exit 0; fi
          if gh pr view "$branch" --json number >/dev/null 2>&1; then exit 0; fi
          gh auth setup-git
          if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            git switch -c "$branch"
            git add -- benchmarks/fix-evals/results/
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: refresh fix evaluation evidence'
            git push origin "HEAD:refs/heads/$branch"
          fi
          printf 'Review the pinned outcomes and raw evidence from %s/%s/actions/runs/%s.\n\nThe results update only after this pull request is reviewed and merged.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/fix-evals-pr.md"
          gh pr create --base main --head "$branch" --title 'test: refresh fix evaluation evidence' --body-file "$RUNNER_TEMP/fix-evals-pr.md"
