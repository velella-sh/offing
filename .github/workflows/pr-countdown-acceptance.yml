name: PR countdown acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  acc-pr-countdown:
    if: github.head_ref == 'feat/343-pr-countdown' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github/fixtures/pr-countdown
          sparse-checkout-cone-mode: false
      - id: offing
        uses: velella-sh/offing@fbb6acf08cdf8cff7ff24fb91b2727303dcf1c14
        with:
          path: .github/fixtures/pr-countdown
          pr-comment: "true"
          upload-report: "true"
          fail-on-severity: none
      - name: Verify and record the packaged Action
        shell: bash
        env:
          FINDINGS: ${{ steps.offing.outputs.findings-json }}
        run: |
          test ! -e package.json
          jq -e 'any(.[]; .path == "Dockerfile" and .line == 1 and (.deadline | length > 0))' <<< "$FINDINGS"
          {
            echo '### acc-pr-countdown'
            echo 'Action version: 0.1.1 (0.1.2 feature candidate)'
            echo 'Packaged Action: fbb6acf08cdf8cff7ff24fb91b2727303dcf1c14'
            echo 'Consumer input: pr-comment: "true"'
            echo 'Fixture: .github/fixtures/pr-countdown/Dockerfile'
          } >> "$GITHUB_STEP_SUMMARY"
