# Release stage: verify. Drafts changelog notes and checks the packed tarball is reproducible.
# Called from release.yml. A dry run builds and checks; it publishes nothing.
name: Release verify

on:
  workflow_call:
    inputs:
      dry_run:
        description: Build and verify only; publish nothing
        type: boolean
        required: true
      from:
        description: Tag or commit to start changelog notes from
        type: string
        required: false
        default: ""
      release_sha:
        description: Commit to check out for a post-publish run; empty uses the default branch
        type: string
        required: false
        default: ""
      run_notes:
        description: Draft release notes from conventional commits
        type: boolean
        required: true
      run_reproducible:
        description: Run the reproducible pack check
        type: boolean
        required: true

      run_lifecycle:
        description: Verify release lifecycle evidence on a clean consumer
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  notes:
    if: inputs.run_notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Draft the release notes
        env:
          FROM: ${{ inputs.from }}
        run: |
          if [ -n "$FROM" ]; then
            node dist/tools/changelog.js --from "$FROM" > release-notes.md
          else
            node dist/tools/changelog.js > release-notes.md
          fi
          { echo "## Draft release notes"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes-${{ github.run_id }}
          path: release-notes.md

  reproducible:
    if: inputs.run_reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Default branch first: ref: workflow_run.head_sha is a Dangerous-Workflow untrusted checkout.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the release commit
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: git checkout --detach "$RELEASE_SHA"
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run check:reproducible --silent
      - name: Record dry-run stage
        if: inputs.dry_run
        run: echo "Verify stage (reproducible) completed in dry run." >> "$GITHUB_STEP_SUMMARY"

  lifecycle:
    if: inputs.run_lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREDICATE_TYPE: https://velella.sh/offing/attestation/v1/
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download the candidate evidence
        if: inputs.dry_run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lifecycle-release
      - name: Download the candidate binary
        if: inputs.dry_run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-linux-x64
      - name: Download the candidate tarball
        if: inputs.dry_run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: first-minute-candidate
      - name: Download the published release as a consumer
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-zA-Z.-]+)?$ ]]
          test "$GITHUB_REF_TYPE" = tag
          gh release download --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" --pattern 'lifecycle*'
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64.exe; do
            gh release download --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" --pattern "offing-$version-$target"
          done
          npm pack --ignore-scripts --registry https://registry.npmjs.org "@velella/offing@$version"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: ${{ !inputs.dry_run }}
      - name: Verify published bytes with the GitHub CLI and Cosign
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow="$GITHUB_REPOSITORY/.github/workflows/release-attest.yml"
          identity="https://github.com/$workflow@$GITHUB_REF"
          verify_gh() {
            gh attestation verify "$1" --bundle lifecycle.sigstore.json --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$workflow" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --predicate-type "$PREDICATE_TYPE" --deny-self-hosted-runners
          }
          verify_cosign() {
            cosign verify-blob-attestation "$1" --bundle lifecycle.sigstore.json --check-claims=true \
              --type "$PREDICATE_TYPE" --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          }
          for artifact in offing-* velella-offing-*.tgz; do
            verify_gh "$artifact"
            verify_cosign "$artifact"
          done
          jq -er '.dsseEnvelope.payload' lifecycle.sigstore.json | base64 -d | cmp - lifecycle.intoto.json
          sha256sum lifecycle.intoto.json lifecycle.sigstore.json lifecycle-subjects.sha256 | cmp - lifecycle-evidence.sha256
          tarballs=(velella-offing-*.tgz)
          mkdir tampered
          tampered="tampered/${tarballs[0]}"
          cp -- "${tarballs[0]}" "$tampered"
          printf 'tampered' >> "$tampered"
          if verify_gh "$tampered" || verify_cosign "$tampered"; then
            echo "A verifier accepted modified release bytes." >&2; exit 1
          fi
      - name: Check signed or candidate statement with the independent verifier
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          sha256sum offing-* velella-offing-*.tgz | cmp - lifecycle-subjects.sha256
          tar -xzf velella-offing-*.tgz \
            package/docs/spec/lifecycle-attestation/conformance/check.mjs \
            package/docs/spec/lifecycle-attestation/example/verify.mjs
          checker=package/docs/spec/lifecycle-attestation/conformance/check.mjs
          verifier=package/docs/spec/lifecycle-attestation/example/verify.mjs
          node "$checker" lifecycle.intoto.json
          for artifact in offing-* velella-offing-*.tgz; do
            node "$verifier" lifecycle.intoto.json "$artifact"
          done
          tarballs=(velella-offing-*.tgz)
          mkdir -p tampered
          tampered="tampered/${tarballs[0]}"
          cp -- "${tarballs[0]}" "$tampered"
          printf 'tampered' >> "$tampered"
          if node "$verifier" lifecycle.intoto.json "$tampered"; then
            echo "The standalone verifier accepted modified bytes." >&2; exit 1
          fi
          {
            printf '### acc-lifecycle-attestation\n\n'
            printf -- '- Dry run %s at %s\n' "$DRY_RUN" "$GITHUB_SHA"
            printf -- '- Statement SHA-256 %s\n' "$(sha256sum lifecycle.intoto.json | cut -d ' ' -f 1)"
            for artifact in offing-* velella-offing-*.tgz; do printf -- '- %s\n' "$(sha256sum "$artifact")"; done
          } >> "$GITHUB_STEP_SUMMARY"
