name: Demos

# Smoke-render the tapes from the candidate or a selected published CLI.
# See docs/demos/README.md for the GIF and MP4 build commands.

on:
  pull_request:
    paths:
      - "demos/**"
      - "docs/assets/demos/**"
      - "docs/demos/**"
      - "tools/demo-manifest.ts"
      - "tools/demo-captions.ts"
      - ".github/workflows/demos.yml"
  push:
    branches: [main]
    paths:
      - "demos/**"
      - "docs/assets/demos/**"
      - "docs/demos/**"
      - "tools/demo-manifest.ts"
      - "tools/demo-captions.ts"
      - ".github/workflows/demos.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Offing version, or leave blank to test the checkout
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: demos
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - name: Install the pinned recorder (VHS, ttyd, ffmpeg)
        env:
          VHS_VERSION: "0.12.1"
          VHS_SHA256: "eb33787a5b1cebf91fe0b18bd231e2d71d36c1ff4babd99ddac1a6ab411efd10"
          TTYD_VERSION: "1.7.7"
          TTYD_SHA256: "8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55"
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/vhs.tar.gz" \
            "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          echo "${VHS_SHA256}  $RUNNER_TEMP/vhs.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/vhs.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "vhs_${VHS_VERSION}_Linux_x86_64/vhs"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ttyd" \
            "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_SHA256}  $RUNNER_TEMP/ttyd" | sha256sum --check -
          # Large downloads from the runner's regional EC2 mirror can exhaust the job timeout.
          sudo sed -i -E 's@https?://[^/]*ec2\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-jetbrains-mono
          sudo install -m 0755 "$RUNNER_TEMP/vhs" "$RUNNER_TEMP/ttyd" /usr/local/bin/
          vhs --version
          ttyd --version
      - name: Resolve the published demo version
        id: release
        if: inputs.version == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Verify the demo inventory and render tapes
        env:
          OFFING_VERSION: ${{ inputs.version }}
          OFFING_DEMO_MANIFEST_VERSION: ${{ steps.release.outputs.version }}
          VHS_NO_SANDBOX: "true"
          OFFING_DEMO_MANIFEST_REGRESSION: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          if [[ -n "$OFFING_VERSION" ]]; then
            bash demos/build.sh --check
          else
            bash demos/build.sh --check-source
          fi
