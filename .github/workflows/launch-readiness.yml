name: Launch readiness

on:
  schedule:
    - cron: "41 8 * * 1"
  release:
    types: [published]
  # Releases created by GITHUB_TOKEN do not emit a follow-on release event.
  # zizmor: ignore[dangerous-triggers] -- read only the run's identity; checkout uses trusted main
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions: {}

concurrency:
  group: launch-readiness
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.repository == 'velella-sh/offing' &&
      (github.event_name == 'schedule' || github.event_name == 'release' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.path == '.github/workflows/release.yml' &&
        github.event.workflow_run.head_repository.full_name == 'velella-sh/offing' &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    uses: ./.github/workflows/launch-readiness-report.yml # zizmor: ignore[self-repository] -- report runs against trusted main
    permissions:
      actions: read
      contents: read
    with:
      release_tag: ${{ github.event.release.tag_name || github.event.workflow_run.head_branch || '' }}

  update-issue:
    needs: collect
    if: github.event_name == 'schedule' || needs.collect.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: launch-readiness-${{ github.run_attempt }}
          path: metrics/launch-readiness
      - name: Refresh the pinned report issue
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ needs.collect.outputs.artifact }}
        run: |
          reports=(metrics/launch-readiness/*.md)
          [[ "${#reports[@]}" == 1 && -f "${reports[0]}" ]]
          bash .github/scripts/publish-launch-readiness.sh "${reports[0]}" "$ARTIFACT_URL"
