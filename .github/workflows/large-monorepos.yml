name: Large monorepos

# Observational nightly: check out the five pinned public monorepos, scan each offline,
# and publish wall time and peak RSS to the job summary and an artifact. Not a required check.

on:
  schedule:
    # Nightly (after mutation at :47 past 4 UTC).
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: large-monorepos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: read suite pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.read.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: read
        name: Emit the suite matrix from benchmarks/large-monorepos.json
        run: |
          targets="$(jq -c '.repositories' benchmarks/large-monorepos.json)"
          count="$(jq '.repositories | length' benchmarks/large-monorepos.json)"
          if [ "$count" != "5" ]; then
            echo "::error::suite must list exactly five repositories (found $count)"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  measure:
    name: measure (${{ matrix.target.id }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - name: Build the large-monorepo harness
        run: npm run build --silent
      - name: Check out ${{ matrix.target.repository }} at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.target.repository }}
          ref: ${{ matrix.target.commit }}
          path: targets/${{ matrix.target.id }}
          persist-credentials: false
      - name: Record scan time and peak memory
        run: |
          mkdir -p artifacts
          node dist/benchmarks/large-monorepos.js \
            --root targets \
            --only "${{ matrix.target.id }}" \
            --warmup 0 \
            --runs 1 \
            --json \
            --output "artifacts/${{ matrix.target.id }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: large-monorepo-${{ matrix.target.id }}
          path: artifacts/${{ matrix.target.id }}.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish suite results
    needs: measure
    if: always() && needs.measure.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - name: Build the merge helper
        run: npm run build --silent
      - name: Download per-repository measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: large-monorepo-*
          path: shard-results
          merge-multiple: true
      - name: Merge results into the job summary and artifact
        run: |
          mkdir -p artifacts
          node dist/benchmarks/large-monorepos.js \
            --merge shard-results \
            --output artifacts/large-monorepos.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: large-monorepos-${{ github.run_id }}
          path: artifacts/large-monorepos.json
          if-no-files-found: error
          retention-days: 30
