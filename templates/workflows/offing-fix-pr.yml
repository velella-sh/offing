name: Offing fix pull request

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offing-fixes
  cancel-in-progress: false

jobs:
  fixes:
    if: github.event.repository.fork == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked] -- the fix publisher needs git credentials and uploads only its own runner-temporary artifacts.
      - uses: velella-sh/offing@v1 # zizmor: ignore[unpinned-uses] -- the conformance consumer path uses the published major ref.
        with:
          fix-pr: "true"
          fail-on-severity: none
