name: Offing fork review

# Install this file on the default branch next to offing-agent-review-scan.yml.
on:
  workflow_run:
    workflows: [Offing fork review signal]
    types: [completed]

permissions: {}
concurrency:
  group: offing-fork-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.offing.outputs.fork-review-plan }}
    steps:
      # Use the full commit SHA of an Offing release that supports fork-review-mode in both jobs.
      - uses: velella-sh/offing@REPLACE_WITH_OFFING_RELEASE_SHA
        id: offing
        with:
          agent-review: 'true'
          fork-review-mode: prepare

  publish:
    needs: prepare
    if: needs.prepare.outputs.plan != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: velella-sh/offing@REPLACE_WITH_OFFING_RELEASE_SHA
        with:
          agent-review: 'true'
          fork-review-mode: publish
          fork-review-plan: ${{ needs.prepare.outputs.plan }}
