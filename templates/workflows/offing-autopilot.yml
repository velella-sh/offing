name: Offing Autopilot

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: offing-autopilot
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.repository.fork == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked] -- the wave publisher needs Git credentials and uploads runner-temporary proof only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned agent
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.330
      - uses: velella-sh/offing@v1 # zizmor: ignore[unpinned-uses] -- the template follows the published Action major version.
        env:
          OFFING_ACTION_AUTOPILOT_KEY: ${{ secrets.OFFING_AUTOPILOT_CLAUDE_KEY }}
        with:
          autopilot: "true"
          agent: claude
          agent-key-secret: OFFING_AUTOPILOT_CLAUDE_KEY
          autopilot-wall-time-ms: "300000"
          autopilot-cost-cents: "100"
