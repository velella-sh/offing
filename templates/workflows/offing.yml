# Copy this file and offing.properties.json into workflow-templates/ in the
# organization's .github repository to offer Offing in the New workflow gallery.

name: Offing

on:
  pull_request:
  push:
    branches: [$default-branch]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: velella-sh/offing@v0.1.1
        with:
          upload-report: "false"
