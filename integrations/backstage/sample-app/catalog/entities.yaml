# Sample Backstage catalog entities for the Offing lifecycle card demo.
# Each Component maps to a path in sample-data/portal-export.json via offing.io/service-path.
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: api
  description: Sample API service with dated lifecycle findings
  annotations:
    offing.io/service-path: /repos/api
spec:
  type: service
  lifecycle: production
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: legacy-batch
  description: Sample batch job with the most findings
  annotations:
    offing.io/service-path: /repos/legacy-batch
spec:
  type: service
  lifecycle: production
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: checkout
  description: Sample service with a clean portal row (no findings)
  annotations:
    offing.io/service-path: /repos/checkout
spec:
  type: service
  lifecycle: production
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payments
  description: Sample payments service
  annotations:
    offing.io/service-path: /repos/payments
spec:
  type: service
  lifecycle: production
  owner: guests
