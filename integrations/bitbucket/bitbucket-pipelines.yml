# Offing lifecycle scan. The step image must provide Node.js 22 or newer for npx to run the package.
# For reproducible builds, pin the version in both commands (offing@X.Y.Z).
pipelines:
  default:
    - step:
        name: Offing lifecycle scan
        image: node:24
        # The report is written before the gate is applied, so it is kept even when the step fails.
        script:
          - npx --yes @velella/offing scan . --json > offing-report.json || true
          - npx --yes @velella/offing scan . --fail-on high
        artifacts:
          - offing-report.json
