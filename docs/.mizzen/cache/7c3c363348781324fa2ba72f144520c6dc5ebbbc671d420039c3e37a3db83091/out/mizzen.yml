# Documentation site for Offing, built by Mizzen with the Lateen theme (see .github/workflows/pages.yml).
title: Offing
description: Local-first deprecation intelligence for software repositories.
lang: en
url: https://velella.sh
base: /offing
include:
  - .well-known
exclude:
  - dashboard/README.md
repository:
  url: https://github.com/velella-sh/offing
  branch: main
  dir: docs
defaults:
  - path: ""
    values:
      image: /assets/og/default.svg
  - path: fa
    values:
      lang: fa
      dir: rtl
  - path: i18n/fa
    values:
      lang: fa
      dir: rtl
theme:
  name: "@velella/lateen"
  options:
    logo:
      light: /assets/brand/offing-mark-adaptive.svg
      dark: /assets/brand/offing-mark-adaptive.svg
    footer:
      copyright: "© Velella"
      license: "MIT license"
      links:
        - title: GitHub
          url: https://github.com/velella-sh/offing
        - title: Mizzen
          url: https://velella.sh/mizzen/
        - title: Lateen
          url: https://velella.sh/lateen/
# Offing publishes its own llms.txt, llms-full.txt and sitemap.xml (docs/llms.txt is curated by hand; the others are
# generated before the build), so Mizzen's own copies stay off.
outputs:
  llms: false
  llms-full: false
  sitemap: false
# Every hand-written page used to be served as <name>.html. These keep those addresses working; the set is frozen
# at the last published site (tests/fixtures/site-urls.baseline.json), so a new page never needs a line here.
